<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I'm Tanya</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      height: 100dvh;
      background: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: clip;
      overflow-y: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Big titles ── */
    .big-text {
      font-family: 'Gasoek One', sans-serif;
      font-size: min(26vw, 17vh);
      line-height: 0.82;
      color: #000;
      text-align: center;
      white-space: normal;
      pointer-events: none;
      letter-spacing: -0.01em;
      flex-shrink: 0;
      width: 100%;
    }

    .big-text:first-child {
      margin-top: -0.06em;   /* push HELLO into top edge */
    }
    .big-text:last-of-type {
      margin-bottom: -0.06em; /* push I'M TANYA into bottom edge */
    }

    /* ── Links area ── */
    .links-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lnk {
      position: relative;
      display: inline-block;
      margin-bottom: -2em;
    }
    .lnk:last-child { margin-bottom: 0; }

    .lnk:nth-child(1) { z-index: 7; }
    .lnk:nth-child(2) { z-index: 6; }
    .lnk:nth-child(3) { z-index: 5; }
    .lnk:nth-child(4) { z-index: 4; }
    .lnk:nth-child(5) { z-index: 3; }
    .lnk:nth-child(6) { z-index: 2; }
    .lnk:nth-child(7) { z-index: 1; }

    .lnk a {
      display: block;
      text-decoration: none;
      font-weight: 800;
      font-size: min(9vw, 11vh);
      letter-spacing: -0.025em;
      line-height: 1;
      padding: .04em .18em .08em;
      white-space: nowrap;
      position: relative;
      transform-origin: center;
      transition: transform .18s cubic-bezier(.34, 1.56, .64, 1);
      background: transparent;
      color: #000;
      -webkit-text-stroke: 0.26em var(--stroke-color);
      stroke-linejoin: round;
      stroke-linecap: round;
      paint-order: stroke fill;
      filter: drop-shadow(0 -3px 4px rgba(0,0,0,0.25));
    }

    .lnk[data-id="strava"]    a { --stroke-color: #F5620F; }
    .lnk[data-id="tg"]        a { --stroke-color: #3EC6F5; }
    .lnk[data-id="spotify"]   a { --stroke-color: #1DB954; }
    .lnk[data-id="threads"]   a { --stroke-color: #1C1C1C; color: #fff; }
    .lnk[data-id="insta"]     a { --stroke-color: #FF1F6D; }
    .lnk[data-id="contact"]   a { --stroke-color: #F5E642; }
    .lnk[data-id="portfolio"] a {
      font-size: min(7.5vw, 9.5vh);
      --stroke-color: #C4A6F0;
      opacity: .45; pointer-events: none; cursor: default;
    }

    /* "not today" badge */
    .badge {
      position: absolute;
      bottom: -11px;
      left: 54%;
      transform: translateX(-50%) rotate(-3deg);
      background: #EDF24A;
      color: #000;
      font-size: clamp(9px, 1.1vw, 12px);
      font-weight: 800;
      padding: 3px 12px 4px;
      border-radius: 20px;
      white-space: nowrap;
      z-index: 20;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.18);
      pointer-events: none;
    }

    @keyframes badge-fall {
      0%   { transform: translateX(-50%) rotate(-3deg)  translateY(0);     opacity: 1; }
      20%  { transform: translateX(-35%) rotate(14deg)  translateY(8px);   }
      55%  { transform: translateX(0%)   rotate(38deg)  translateY(55px);  opacity: .9; }
      100% { transform: translateX(25%)  rotate(68deg)  translateY(130px); opacity: 0; }
    }
    @keyframes badge-return {
      0%   { transform: translateX(25%)  rotate(68deg)  translateY(130px); opacity: 0; }
      55%  { transform: translateX(-56%) rotate(-6deg)  translateY(-14px); opacity: 1; }
      78%  { transform: translateX(-48%) rotate(-1deg)  translateY(5px);   }
      100% { transform: translateX(-50%) rotate(-3deg)  translateY(0);     opacity: 1; }
    }

    /* ── Desktop hover layer ── */
    #hover-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 300;
    }
    .floater {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.55) translateY(8px);
      transition: opacity .22s ease, transform .3s cubic-bezier(.34, 1.56, .64, 1);
    }
    .floater.on { opacity: 1; transform: scale(1) translateY(0); }
    .floater:nth-child(2) { transition-delay: .07s; }

    .f-emoji {
      font-size: clamp(48px, 6.5vw, 76px);
      filter: drop-shadow(3px 4px 6px rgba(0,0,0,0.16));
      line-height: 1;
    }
    .f-post {
      background: #111; color: #fff;
      border-radius: 14px; padding: 11px 14px 13px;
      width: clamp(145px, 17vw, 200px);
      box-shadow: 4px 6px 18px rgba(0,0,0,0.26);
    }
    .f-post .p-meta  { font-size: 11px; opacity: .52; margin-bottom: 5px; }
    .f-post .p-text  { font-size: 13px; line-height: 1.42; }
    .f-post .p-stats { margin-top: 8px; font-size: 11px; opacity: .42; display: flex; gap: 12px; }

    /* ══ MOBILE ═══════════════════════════════════════════════════ */
    @media (max-width: 1024px) {

      /* Big text: full-width on mobile */
      .big-text {
        font-size: 26vw;
        line-height: 0.88;
      }

      /* Links: spacing for tap targets */
      .lnk {
        margin-bottom: 0.18em;
      }
      .lnk:last-child { margin-bottom: 0; }

      /* Reset desktop z-stacking */
      .lnk:nth-child(1),
      .lnk:nth-child(2),
      .lnk:nth-child(3),
      .lnk:nth-child(4),
      .lnk:nth-child(5),
      .lnk:nth-child(6),
      .lnk:nth-child(7) { z-index: 1; }

      .lnk a {
        font-size: min(13vw, 9vh);
        padding: .04em .18em .08em;
        transition: none;
      }

      .lnk[data-id="portfolio"] a {
        font-size: min(11vw, 7.5vh);
      }

      .badge {
        font-size: 10px;
        padding: 3px 10px 4px;
        bottom: -10px;
      }

      /* Gentle sway — applied to .lnk so badge moves with the pill */
      @keyframes sway {
        0%, 100% { transform: translateX(0)   rotate(0deg); }
        33%       { transform: translateX(4px)  rotate(.3deg); }
        66%       { transform: translateX(-4px) rotate(-.3deg); }
      }

      .lnk[data-id="strava"]    { animation: sway 3.2s ease-in-out infinite 0s;    }
      .lnk[data-id="tg"]        { animation: sway 2.9s ease-in-out infinite -.7s;  }
      .lnk[data-id="threads"]   { animation: sway 3.5s ease-in-out infinite -1.4s; }
      .lnk[data-id="insta"]     { animation: sway 3.1s ease-in-out infinite -2.0s; }
      .lnk[data-id="spotify"]   { animation: sway 3.3s ease-in-out infinite -1.1s; }
      .lnk[data-id="contact"]   { animation: sway 2.8s ease-in-out infinite -.3s;  }
      .lnk[data-id="portfolio"] { animation: sway 3.4s ease-in-out infinite -1.8s; }
    }
  </style>
</head>
<body>

  <div class="big-text">HELLO</div>

  <div class="links-wrap">
    <nav class="links-stack" id="stack">

      <div class="lnk" data-id="strava">
        <a href="https://www.strava.com/athletes/94319734" target="_blank" rel="noopener">strava</a>
      </div>
      <div class="lnk" data-id="tg">
        <a href="https://t.me/perfectootanyaa" target="_blank" rel="noopener">tg-channel</a>
      </div>
      <div class="lnk" data-id="spotify">
        <a href="https://open.spotify.com/user/316mjm5sosnorehwiagpyl776pvq?si=d6fd7da98df04858" target="_blank" rel="noopener">spotify</a>
      </div>
      <div class="lnk" data-id="threads">
        <a href="https://www.threads.net/@perfectootanya" target="_blank" rel="noopener">threads</a>
      </div>
      <div class="lnk" data-id="insta">
        <a href="https://www.instagram.com/perfectootanya" target="_blank" rel="noopener">instagram</a>
      </div>
      <div class="lnk" data-id="contact">
        <a href="https://t.me/trofimukta" target="_blank" rel="noopener">contact me</a>
      </div>
      <div class="lnk" data-id="portfolio">
        <a href="#" tabindex="-1">portfolio</a>
        <div class="badge" id="badge">not today</div>
      </div>

    </nav>
  </div>

  <div class="big-text">I'M TANYA</div>

  <div id="hover-layer"></div>

  <script>
  (() => {
    const isMobile = window.matchMedia('(max-width: 1024px)').matches
                  || window.matchMedia('(hover: none)').matches;

    // ── Badge fall → return (works on both desktop + mobile) ──
    const badge    = document.getElementById('badge');
    const portLnk  = document.querySelector('[data-id="portfolio"]');
    let   fallen   = false;
    let   returnTm = null;

    function dropBadge() {
      if (fallen) return;
      fallen = true;
      clearTimeout(returnTm);
      badge.style.animation = 'none';
      badge.offsetHeight;
      badge.style.animation = 'badge-fall .85s cubic-bezier(.55,0,.75,.45) forwards';
      returnTm = setTimeout(() => {
        badge.style.animation = 'none';
        badge.style.transform = 'translateX(25%) rotate(68deg) translateY(130px)';
        badge.style.opacity   = '0';
        badge.offsetHeight;
        setTimeout(() => {
          fallen = false;
          badge.style.animation = 'badge-return .65s cubic-bezier(.34,1.56,.64,1) forwards';
          badge.addEventListener('animationend', () => {
            badge.style.animation = '';
            badge.style.transform = '';
            badge.style.opacity   = '';
          }, { once: true });
        }, 1600);
      }, 870);
    }

    portLnk.addEventListener('mouseenter', dropBadge);
    portLnk.addEventListener('touchstart', dropBadge, { passive: true });

    // Mobile: sway is CSS-only, taps navigate via href — nothing else needed
    if (isMobile) return;

    // ── DESKTOP: dock scale + hover floaters ──────────────────
    const DATA = {
      strava:  {
        emoji: '🚴‍♀️',
        post: { meta: 'strava · today', text: 'morning ride\n28 km · 1:04:12 · ↑ 180m', stats: ['♡ 14', '↩ 2'] }
      },
      tg: {
        emoji: '📢',
        post: { meta: 't.me/perfectootanyaa · just now', text: 'новый пост в канале 🔥', stats: ['👁 812', '↩ 33'] }
      },
      spotify: {
        emoji: '🪩',
        post: { meta: 'spotify · now playing', text: 'Baby Come Back\nMusic video · Player', stats: ['♡', '▶ 2.1M'] }
      },
      threads: {
        emoji: '✍️',
        post: { meta: 'perfectootanya · 20.05.2026', text: 'мечта №54: подружка — HR, которая тебя трудоустроит', stats: ['♡ 812', '↩ 33'] }
      },
      insta: {
        emoji: '🌸',
        post: { meta: '@perfectootanya', text: 'latest drop 🤍', stats: ['♡ 1,204', '💬 57'] }
      },
      contact: {
        emoji: '💌',
        post: { meta: 'new message', text: 'hey tanya! love your work and would love to connect...', stats: null }
      }
    };

    const layer  = document.getElementById('hover-layer');
    let   active = [];

    function clearFloaters(instant) {
      active.forEach(f => {
        f.classList.remove('on');
        if (instant) { f.remove(); }
        else { f.addEventListener('transitionend', () => f.remove(), { once: true }); }
      });
      active = [];
    }

    function spawnFloaters(item) {
      const id   = item.dataset.id;
      const data = DATA[id];
      if (!data) return;
      clearFloaters(true);

      const rect = item.querySelector('a').getBoundingClientRect();
      const cy   = rect.top + rect.height / 2;

      const places = [
        { x: rect.left - 96,  y: cy - 40 },   // emoji: left of pill
        { x: rect.right + 16, y: cy - 65 }    // post: right of pill
      ];
      const contents = [
        `<div class="f-emoji">${data.emoji}</div>`,
        `<div class="f-post">
          <div class="p-meta">${data.post.meta}</div>
          <div class="p-text">${data.post.text.replace(/\n/g, '<br>')}</div>
          ${data.post.stats ? `<div class="p-stats">${data.post.stats.map(s => `<span>${s}</span>`).join('')}</div>` : ''}
        </div>`
      ];

      places.forEach(({ x, y }, i) => {
        const f = document.createElement('div');
        f.className = 'floater';
        f.innerHTML = contents[i];
        f.style.left = Math.max(4, Math.min(window.innerWidth - (i ? 205 : 90), x)) + 'px';
        f.style.top  = Math.max(4, Math.min(window.innerHeight - 120, y)) + 'px';
        layer.appendChild(f);
        active.push(f);
        requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('on')));
      });
    }

    const allLnks  = Array.from(document.querySelectorAll('.lnk'));
    const dockScale = d => [1.55, 1.22, 1.07][d] ?? 1;

    allLnks.forEach((item, i) => {
      item.addEventListener('mouseenter', () => {
        allLnks.forEach((el, j) => {
          el.querySelector('a').style.transform = `scale(${dockScale(Math.abs(i - j))})`;
          el.style.zIndex = j === i ? 50 : 6 - j;
        });
      });
    });

    document.getElementById('stack').addEventListener('mouseleave', () => {
      allLnks.forEach((el, j) => {
        el.querySelector('a').style.transform = '';
        el.style.zIndex = 6 - j;
      });
    });

    document.querySelectorAll('.lnk:not([data-id="portfolio"])').forEach(item => {
      item.addEventListener('mouseenter', () => spawnFloaters(item));
      item.addEventListener('mouseleave', () => clearFloaters());
    });
  })();
  </script>
</body>
</html>
