<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanya Trofimuk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Inter:wght@400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #fff;
      color: #000;
      font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* ── Name top ── */
    .name-top,
    .name-bottom {
      font-size: clamp(72px, 16vw, 180px);
      font-weight: 900;
      letter-spacing: -.03em;
      line-height: .88;
      text-transform: uppercase;
      color: #000;
      pointer-events: none;
    }

    /* ── Links stack ── */
    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: -4px;
      margin: clamp(8px, 2vw, 20px) 0;
      position: relative;
    }

    .link-item {
      display: block;
      text-decoration: none;
      font-size: clamp(28px, 5.5vw, 64px);
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: 1;
      text-transform: lowercase;
      padding: 2px 12px;
      border-radius: 8px;
      transform-origin: center center;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1),
                  font-size .2s cubic-bezier(.34,1.56,.64,1);
      cursor: pointer;
      position: relative;
      z-index: 1;
      white-space: nowrap;
    }

    .link-item:hover { z-index: 10; }

    /* Colours — matching reference vibe */
    .link-item:nth-child(1) { color: #fc5200; }                  /* strava orange */
    .link-item:nth-child(2) { color: #29b6f6; }                  /* tg blue */
    .link-item:nth-child(3) { color: #000; }                     /* threads black */
    .link-item:nth-child(4) { color: #e1306c; }                  /* instagram pink */
    .link-item:nth-child(5) { color: #7c3aed; }                  /* contact purple */
    .link-item:nth-child(6) { color: #16a34a; }                  /* portfolio green */

    /* Background pill on each word (like reference sticker look) */
    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: currentColor;
      opacity: .12;
      transform: scaleX(.97);
      transition: opacity .2s, transform .2s;
    }
    .link-item:hover::before {
      opacity: .18;
      transform: scaleX(1);
    }
  </style>
</head>
<body>

  <div class="name-top">Tanya</div>

  <nav class="links" id="links">
    <a href="https://www.strava.com/athletes/YOUR_ID"   target="_blank" rel="noopener" class="link-item">strava</a>
    <a href="https://t.me/YOUR_CHANNEL"                 target="_blank" rel="noopener" class="link-item">tg channel</a>
    <a href="https://www.threads.net/@YOUR_HANDLE"      target="_blank" rel="noopener" class="link-item">threads</a>
    <a href="https://www.instagram.com/YOUR_HANDLE"     target="_blank" rel="noopener" class="link-item">instagram</a>
    <a href="mailto:YOUR@EMAIL.COM"                                      class="link-item">contact me</a>
    <a href="#"                                                          class="link-item" style="opacity:.4;pointer-events:none;">portfolio</a>
  </nav>

  <div class="name-bottom">Trofimuk</div>

  <script>
    // macOS dock magnification effect
    const links = document.getElementById('links');
    const items = Array.from(links.querySelectorAll('.link-item'));

    const BASE   = 1;       // normal scale
    const PEAK   = 1.55;    // hovered item scale
    const NEAR1  = 1.25;    // direct neighbours
    const NEAR2  = 1.1;     // two away

    function getScale(dist) {
      if (dist === 0) return PEAK;
      if (dist === 1) return NEAR1;
      if (dist === 2) return NEAR2;
      return BASE;
    }

    items.forEach((item, i) => {
      item.addEventListener('mouseenter', () => {
        items.forEach((el, j) => {
          const dist = Math.abs(i - j);
          const scale = getScale(dist);
          el.style.transform = `scale(${scale})`;
          el.style.zIndex = dist === 0 ? 10 : Math.max(1, 5 - dist);
        });
      });
    });

    links.addEventListener('mouseleave', () => {
      items.forEach(el => {
        el.style.transform = 'scale(1)';
        el.style.zIndex = 1;
      });
    });

    // Touch support — tap briefly magnifies
    items.forEach((item, i) => {
      item.addEventListener('touchstart', () => {
        items.forEach((el, j) => {
          el.style.transform = `scale(${getScale(Math.abs(i - j))})`;
        });
      }, { passive: true });
      item.addEventListener('touchend', () => {
        setTimeout(() => {
          items.forEach(el => el.style.transform = 'scale(1)');
        }, 400);
      });
    });
  </script>
</body>
</html>
