<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanya — Links</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg: rgba(255 255 255 / .08);
      --glass-border: rgba(255 255 255 / .18);
      --glass-shadow: rgba(0 0 0 / .35);
      --blur: 18px;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      background: #090912;
      color: #fff;
    }

    /* ── Animated aurora background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .55;
      animation: drift linear infinite;
    }
    .orb-1 { width: 520px; height: 520px; background: #7c3aed; top: -120px; left: -100px; animation-duration: 18s; }
    .orb-2 { width: 420px; height: 420px; background: #ec4899; top: 40%;  right: -80px;  animation-duration: 22s; animation-delay: -7s; }
    .orb-3 { width: 360px; height: 360px; background: #06b6d4; bottom: -80px; left: 30%; animation-duration: 26s; animation-delay: -13s; }
    .orb-4 { width: 280px; height: 280px; background: #f59e0b; top: 60%; left: -60px; animation-duration: 20s; animation-delay: -4s; }

    @keyframes drift {
      0%   { transform: translate(0,   0)   rotate(0deg); }
      25%  { transform: translate(60px, -40px) rotate(90deg); }
      50%  { transform: translate(30px, 60px)  rotate(180deg); }
      75%  { transform: translate(-50px,20px)  rotate(270deg); }
      100% { transform: translate(0,   0)   rotate(360deg); }
    }

    /* Mesh noise overlay for texture */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      opacity: .4;
    }

    /* ── Card ── */
    .scene {
      position: relative;
      z-index: 10;
      perspective: 900px;
    }

    .card {
      width: min(400px, 92vw);
      padding: 2.4rem 2rem 2.2rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      backdrop-filter: blur(var(--blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      box-shadow:
        0 8px 32px var(--glass-shadow),
        inset 0 1px 0 rgba(255 255 255 / .12);
      transform-style: preserve-3d;
      transition: transform .08s ease-out;
      will-change: transform;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.6rem;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4);
      padding: 3px;
      position: relative;
      animation: spin-border 4s linear infinite;
    }
    @keyframes spin-border {
      to { filter: hue-rotate(360deg); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .name {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -.01em;
      background: linear-gradient(135deg, #e0e7ff, #f9a8d4, #a5f3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .bio {
      font-size: .85rem;
      color: rgba(255 255 255 / .55);
      text-align: center;
      line-height: 1.5;
      max-width: 280px;
    }

    /* ── Links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .9rem 1.1rem;
      border-radius: 16px;
      background: rgba(255 255 255 / .06);
      border: 1px solid rgba(255 255 255 / .1);
      color: #fff;
      text-decoration: none;
      font-size: .92rem;
      font-weight: 500;
      letter-spacing: .01em;
      position: relative;
      overflow: hidden;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1),
                  background .18s ease,
                  border-color .18s ease,
                  box-shadow .18s ease;
      cursor: pointer;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      opacity: 0;
      transition: opacity .22s ease;
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.025);
      border-color: rgba(255 255 255 / .25);
      box-shadow: 0 8px 24px rgba(0 0 0 / .3), 0 0 0 1px var(--accent-a);
    }
    .link-btn:hover::before { opacity: .14; }
    .link-btn:active { transform: scale(.97); }

    .link-btn .icon {
      font-size: 1.4rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 12px rgba(0 0 0 / .25);
    }

    .link-btn .label { position: relative; z-index: 1; }
    .link-btn .arrow {
      margin-left: auto;
      font-size: .9rem;
      opacity: .45;
      position: relative;
      z-index: 1;
      transition: opacity .18s, transform .18s;
    }
    .link-btn:hover .arrow { opacity: .9; transform: translateX(3px); }

    /* Per-link accent colours */
    .btn-telegram   { --accent-a: #29b6f6; --accent-b: #0277bd; }
    .btn-threads    { --accent-a: #e0e0e0; --accent-b: #757575; }
    .btn-strava     { --accent-a: #fc5200; --accent-b: #bf360c; }
    .btn-contact    { --accent-a: #ab47bc; --accent-b: #6a1b9a; }
    .btn-portfolio  { --accent-a: #66bb6a; --accent-b: #1b5e20; }

    /* Divider */
    .divider {
      height: 1px;
      background: rgba(255 255 255 / .08);
      margin: .25rem 0;
    }

    /* Placeholder badge */
    .badge {
      margin-left: auto;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: rgba(255 255 255 / .4);
      border: 1px solid rgba(255 255 255 / .15);
      border-radius: 20px;
      padding: .15rem .55rem;
      position: relative;
      z-index: 1;
    }

    /* ── Floating particles ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255 255 255 / .55);
      animation: float-up linear infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: .6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ── Entry animation ── */
    .card {
      animation: card-in .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(40px) scale(.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .link-btn {
      animation: link-in .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .link-btn:nth-child(1) { animation-delay: .15s; }
    .link-btn:nth-child(2) { animation-delay: .22s; }
    .link-btn:nth-child(3) { animation-delay: .29s; }
    .link-btn:nth-child(4) { animation-delay: .36s; }
    .link-btn:nth-child(5) { animation-delay: .43s; }

    @keyframes link-in {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Spotlight follow ── */
    .card-spotlight {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events: none;
      background: radial-gradient(300px circle at var(--mx,50%) var(--my,50%),
        rgba(255 255 255 / .07), transparent 70%);
      z-index: 0;
      transition: opacity .3s;
      opacity: 0;
    }
    .card:hover .card-spotlight { opacity: 1; }

    /* Mobile */
    @media (max-width: 440px) {
      .card { padding: 1.8rem 1.4rem 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- Animated BG -->
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <div class="noise"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Card -->
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="card-spotlight" id="spotlight"></div>

      <!-- Profile -->
      <div class="avatar-wrap">
        <div class="avatar">
          <div class="avatar-inner">
            <!-- Replace with: <img src="your-photo.jpg" alt="photo"> -->
            ✨
          </div>
        </div>
        <div>
          <div class="name">Таня Трофімук</div>
          <div class="bio">Ваш короткий опис — чим займаєтесь, що вас надихає</div>
        </div>
      </div>

      <!-- Links -->
      <div class="links">
        <a href="https://t.me/YOUR_CHANNEL" target="_blank" rel="noopener" class="link-btn btn-telegram">
          <span class="icon">✈️</span>
          <span class="label">Telegram</span>
          <span class="arrow">→</span>
        </a>

        <a href="https://www.threads.net/@YOUR_HANDLE" target="_blank" rel="noopener" class="link-btn btn-threads">
          <span class="icon">🧵</span>
          <span class="label">Threads</span>
          <span class="arrow">→</span>
        </a>

        <a href="https://www.strava.com/athletes/YOUR_ID" target="_blank" rel="noopener" class="link-btn btn-strava">
          <span class="icon">🏃</span>
          <span class="label">Strava</span>
          <span class="arrow">→</span>
        </a>

        <div class="divider"></div>

        <a href="mailto:YOUR@EMAIL.COM" class="link-btn btn-contact">
          <span class="icon">💌</span>
          <span class="label">Зв'язатися</span>
          <span class="arrow">→</span>
        </a>

        <a href="#" class="link-btn btn-portfolio" style="opacity:.55; pointer-events:none;">
          <span class="icon">🗂️</span>
          <span class="label">Портфоліо</span>
          <span class="badge">Скоро</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // ── 3D tilt on mouse move ──
    const scene = document.getElementById('scene');
    const card  = document.getElementById('card');
    const spot  = document.getElementById('spotlight');

    scene.addEventListener('mousemove', e => {
      const { left, top, width, height } = card.getBoundingClientRect();
      const x = (e.clientX - left) / width;
      const y = (e.clientY - top)  / height;
      const rotX = (y - .5) * -14;
      const rotY = (x - .5) *  16;
      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
      spot.style.setProperty('--mx', `${x * 100}%`);
      spot.style.setProperty('--my', `${y * 100}%`);
    });

    scene.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
    });

    // Touch tilt for mobile
    scene.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      const { left, top, width, height } = card.getBoundingClientRect();
      const x = (touch.clientX - left) / width;
      const y = (touch.clientY - top)  / height;
      const rotX = (y - .5) * -8;
      const rotY = (x - .5) *  10;
      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.015)`;
    }, { passive: true });

    scene.addEventListener('touchend', () => {
      card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
    });

    // ── Floating particles ──
    const container = document.getElementById('particles');
    function spawnParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 2;
      p.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 8 + 6}s;
        animation-delay: ${Math.random() * 4}s;
        opacity: ${Math.random() * .5 + .2};
      `;
      container.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
    for (let i = 0; i < 24; i++) spawnParticle();
    setInterval(spawnParticle, 800);

    // ── Ripple click effect ──
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 1.8;
        ripple.style.cssText = `
          position:absolute; border-radius:50%; pointer-events:none;
          width:${size}px; height:${size}px;
          left:${e.clientX - rect.left - size/2}px;
          top:${e.clientY - rect.top - size/2}px;
          background:rgba(255,255,255,.18);
          transform:scale(0); animation: ripple-out .55s ease forwards;
        `;
        this.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      });
    });

    const style = document.createElement('style');
    style.textContent = `@keyframes ripple-out { to { transform:scale(1); opacity:0; } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
